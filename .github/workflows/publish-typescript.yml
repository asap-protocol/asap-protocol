# Per-package tags: client-v<version> publishes @asap-protocol/client and
# mcp-auth-v<version> publishes @asap-protocol/mcp-auth, with provenance (OIDC).
# scripts/npm_publish_target.py maps the tag to its package, fails when the tag version
# differs from package.json, and picks the dist-tag (rc for a prerelease, else latest).
# The Python tag v* does not publish npm. PRs → npm publish --dry-run for all four packages.
name: Publish TypeScript SDK

on:
  push:
    tags:
      - "client-v*"
      - "mcp-auth-v*"
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, release/2.6.0]
    paths:
      - "packages/typescript/client/**"
      - "packages/typescript/mastra/**"
      - "packages/typescript/openai-agents/**"
      - "packages/typescript/mcp-auth/**"
      - "scripts/npm_publish_target.py"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/publish-typescript.yml"

defaults:
  run:
    shell: bash

concurrency:
  group: publish-typescript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dry-run:
    name: npm publish dry-run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @asap-protocol/client (tshy)
        run: pnpm --filter @asap-protocol/client run build

      - name: Build @asap-protocol/mastra (tshy)
        run: pnpm --filter @asap-protocol/mastra run build

      - name: Build @asap-protocol/openai-agents (tshy)
        run: pnpm --filter @asap-protocol/openai-agents run build

      - name: Build @asap-protocol/mcp-auth (tshy)
        run: pnpm --filter @asap-protocol/mcp-auth run build

      - name: Check each tag-published package against its tag rule
        run: |
          for package in client mcp-auth; do
            version=$(node -p "require('./packages/typescript/${package}/package.json').version")
            python3 scripts/npm_publish_target.py "${package}-v${version}"
          done

      - name: npm publish --dry-run (@asap-protocol/client)
        working-directory: packages/typescript/client
        run: npm publish --dry-run --access public

      - name: npm publish --dry-run (@asap-protocol/mastra)
        working-directory: packages/typescript/mastra
        run: npm publish --dry-run --access public

      - name: npm publish --dry-run (@asap-protocol/openai-agents)
        working-directory: packages/typescript/openai-agents
        run: npm publish --dry-run --access public

      - name: npm publish --dry-run (@asap-protocol/mcp-auth)
        working-directory: packages/typescript/mcp-auth
        run: npm publish --dry-run --access public

  publish:
    name: Publish the package that the tag names
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.4

      # No registry-url: avoid setup-node defaulting NODE_AUTH_TOKEN to GITHUB_TOKEN,
      # which npm rejects for registry.npmjs.org and breaks OIDC Trusted Publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted Publishing requires Node ≥22.14 and npm CLI ≥11.5.1 (npm docs).
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Upgrade npm for Trusted Publishing (OIDC)
        run: npm install -g npm@11.5.1

      # Fails when the tag names no package or its version differs from package.json.
      - name: Resolve the package, version, and dist-tag from the tag
        id: target
        run: python3 scripts/npm_publish_target.py "${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the package and its workspace dependencies (tshy)
        env:
          PACKAGE_NAME: ${{ steps.target.outputs.package_name }}
        run: pnpm --filter "${PACKAGE_NAME}..." run build

      - name: Publish to npm with provenance
        working-directory: ${{ steps.target.outputs.package_dir }}
        env:
          DIST_TAG: ${{ steps.target.outputs.dist_tag }}
        run: npm publish --access public --provenance --tag "${DIST_TAG}"
