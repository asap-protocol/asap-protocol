name: TypeScript SDK

on:
  push:
    branches: [main]
    paths:
      - "packages/typescript/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/typescript-sdk.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/typescript/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/typescript-sdk.yml"

concurrency:
  group: typescript-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-test:
    name: lint, typecheck, test, treeshake
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @asap-protocol/client lint

      - name: Typecheck
        run: pnpm --filter @asap-protocol/client run typecheck

      - name: Test with coverage
        run: pnpm --filter @asap-protocol/client test

      - name: Tree-shake check (agadoo)
        run: pnpm --filter @asap-protocol/client run check:treeshake
