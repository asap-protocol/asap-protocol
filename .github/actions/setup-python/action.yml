# Composite action: Install uv (with cache), Python 3.13, and sync dependencies.
# Use after actions/checkout so pyproject.toml and uv.lock are present.
name: "Setup Python (uv)"
description: "Install uv with cache, Python 3.13, and sync dev dependencies"

inputs:
  sync-flags:
    description: "Extra arguments appended to `uv sync` (e.g. `--no-extra crewai --no-extra llamaindex` for pip-audit)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.13
      shell: bash

    - name: Install dependencies
      run: uv sync --frozen --all-extras --dev ${{ inputs.sync-flags }}
      shell: bash
